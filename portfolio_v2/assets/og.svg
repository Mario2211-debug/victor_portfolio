<!-- Fonte da imagem OG. Rasterizar para public/og.png a 1200x630.
     Os valores de cor são os passos da escala em src/index.css, convertidos
     para hex porque o SVG é rasterizado fora do browser. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#000000"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#25272c" stroke-width="2"/>
  <g font-family="Ubuntu Sans, DejaVu Sans, sans-serif">
    <circle cx="100" cy="112" r="8" fill="#5ecfe8"/>
    <text x="126" y="120" font-size="26" fill="#8f939c" letter-spacing="4">SOFTWARE ENGINEER</text>
    <text x="96" y="300" font-size="104" font-weight="500" fill="#f4f5f7" letter-spacing="-3">Mário Afonso</text>
    <text x="96" y="382" font-size="36" fill="#8f939c">Fullstack engineer crafting intelligent, scalable</text>
    <text x="96" y="434" font-size="36" fill="#8f939c">systems across web, automation and IoT.</text>
    <line x1="96" y1="500" x2="1104" y2="500" stroke="#25272c" stroke-width="2"/>
    <text x="96" y="556" font-size="28" fill="#8f939c">Porto, Portugal</text>
    <text x="1104" y="556" font-size="28" fill="#8f939c" text-anchor="end">victor-portfolio-sepia.vercel.app</text>
  </g>
</svg>
